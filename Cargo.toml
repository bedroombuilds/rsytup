[package]
name = "rsytup"
version = "0.3.0"
edition = "2024"
authors = ["Michael Kefeder"]
repository = "https://github.com/bedroombuilds/rsytup/"
license = "GPL-3.0-or-later"
keywords = ["video", "youtube"]
categories = ["command-line-utilities", "multimedia"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
async-google-apis-common = "0.3.0"
# TODO: fix dependency once PR #539 is merged <https://github.com/chronotope/chrono/pull/539>
#chrono = "0.4.20"
# chrono = { git ="https://github.com/mike-kfed/chrono", branch="impl_error" }
conv = "0.3.3"
env_logger = "0.9.3"
hyper-rustls = "0.22"
hyper = "0.14.32"
image = "0.24.9"
imageproc = "0.23.0"
rusttype = "0.9.3"
serde = "1.0.228"
clap = { version = "4.5", features = ["derive"] }
strum = { version = "0.24.1", features = ["derive", "strum_macros"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "io-util", "macros", "fs"] }
webbrowser = "0.7.1"
chrono = { version = "0.4.42", default-features = false }
